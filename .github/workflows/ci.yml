name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy-scrub gate
        run: bash scripts/scrub.sh

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Catalog lockstep validation
        run: node scripts/validate-catalog.js

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link check (README, docs, GLOSSARY)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude 'npmjs\.com|shields\.io|skills\.sh'
            README.md docs/ GLOSSARY.md CHANGELOG.md CONTRIBUTING.md
            skills/bak/references/ adapters/
          fail: true

  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upstream path-existence (pinned refs)
        run: |
          # Fail loudly when a pinned skill path moved or was deleted upstream.
          FAILED=0
          while IFS='|' read -r provider src path rest; do
            provider="${provider// /}"; src="${src// /}"; path="${path// /}"
            [ -z "$provider" ] && continue
            case "$provider" in
              mattpocock) repo="mattpocock/skills"; ref="main" ;;
              pstack) repo="cursor/plugins"; ref="main" ;;
              vercel-labs) repo="vercel-labs/skills"; ref="main" ;;
              chrome-devtools) repo="ChromeDevTools/chrome-devtools-mcp"; ref="main" ;;
              *) continue ;;
            esac
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://raw.githubusercontent.com/$repo/$ref/$path/SKILL.md")
            if [ "$code" != "200" ]; then
              echo "STALE PIN: $provider $path (HTTP $code)"
              FAILED=1
            fi
          done < <(grep -vE '^\s*(#|$)' manifest/upstream-sources.txt | grep -v '^local:')
          exit $FAILED
